<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f1">
<title>Onde é Minha Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: app de uma coluna para celular — busca no topo, salão desenhado na vertical (palco em cima, entrada embaixo) */
:root {
  --bg: #f5f6f1;
  --fg: #1d231f;
  --muted: #5d665f;
  --floor: #e7eae1;
  --wall: #b9c0b4;
  --table: #ffffff;
  --table-line: #aab2a6;
  --stage: #3f4542;
  --stage-fg: #f1e9c8;
  --accent: #d42a1f;
  --accent-fg: #ffffff;
  --hit: #f4b400;
  --hit-fg: #1d231f;
  --route: #d42a1f;
  --card: #ffffff;
  --ok: #2e7d4f;
  --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Sempre em fundo claro, mesmo com o celular no modo escuro */
:root, :root[data-theme] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

header { display: flex; flex-direction: column; gap: 2px; }
.eyebrow {
  font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent);
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(26px, 8vw, 34px);
  line-height: 1.02;
  margin: 0;
  text-wrap: balance;
}

html, body { height: 100%; }
.tela-busca { min-height: 100%; justify-content: center; gap: 28px; padding-block: 32px; }
.tela-busca h1 { font-size: clamp(28px, 8.5vw, 34px); line-height: 1.1; }
.tela-busca header { align-items: center; text-align: center; }
.tela-busca .marca { justify-content: center; text-align: left; }
.tela-busca .lead { margin-inline: auto; }
.marca { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.logo { width: 96px; height: 96px; flex: none; }
.marca-nome { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.marca-casa { font: 400 22px/1.1 var(--font-display); color: var(--accent); }
.marca-evento { font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--fg); }
.lead { margin: 10px 0 0; color: var(--muted); font-size: 17px; max-width: 30ch; }
.tela-busca form { flex-direction: column; gap: 12px; }
.tela-busca #mesa { font-size: 52px; text-align: center; padding: 30px 14px 12px; }
.tela-busca .field label { left: 0; right: 0; text-align: center; top: 10px; }
.tela-busca button[type="submit"] { padding: 18px 20px; font-size: 19px; }
.erro { margin: 0; color: var(--accent); font-weight: 600; text-align: center; }
.tela-busca footer { margin-top: 8px; }

.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.voltar {
  background: transparent; color: var(--fg);
  border: 2px solid var(--table-line);
  padding: 10px 14px; font-size: 15px;
}
.lugares {
  align-self: flex-start;
  margin: 8px 0 0;
  padding: 6px 12px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--hit) 30%, var(--card));
  border: 1.5px solid var(--hit);
  font-weight: 800; font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.chegadas {
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: var(--card);
  border: 1.5px solid var(--table-line);
}
.cheg-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cheg-conta { display: flex; align-items: baseline; gap: 8px; }
.cheg-num { font: 400 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.cheg-de { font-weight: 600; color: var(--muted); }
.cheg-status { font-weight: 800; font-size: 14px; color: var(--muted); }
.cheg-status.ok { color: var(--ok); }
.cheg-status.alerta { color: var(--accent); }
.assentos { display: flex; flex-wrap: wrap; gap: 6px; }
.assentos i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--table-line); background: var(--card); }
.assentos i.on { background: var(--ok); border-color: var(--ok); }
.assentos i.extra { background: var(--accent); border-color: var(--accent); }
.cheg-btns { display: flex; gap: 8px; }
.cheg-btns button { padding: 14px 16px; font-size: 17px; }
.cheg-btns .menos { background: transparent; color: var(--fg); border: 2px solid var(--table-line); min-width: 64px; }
.cheg-btns .mais { flex: 1; background: var(--ok); color: #ffffff; }
.cheg-btns button:disabled { opacity: .4; cursor: default; }
.cheg-erro { margin: 0; color: var(--accent); font-size: 13px; font-weight: 600; }
.cheg-completa {
  margin: 0;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--ok);
  color: #ffffff;
  font-weight: 800;
  font-size: 17px;
  line-height: 1.3;
  animation: completa .45s ease-out;
}
.cheg-completa small { display: block; font-weight: 600; font-size: 14px; opacity: .9; }
.cheg-completa.alerta { background: var(--accent); }
@keyframes completa { 0% { transform: scale(.92); opacity: 0; } 70% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .cheg-completa { animation: none; } }
.t.completa circle { stroke: var(--ok); stroke-width: 3; }
.selo {
  font: 400 22px/1 var(--font-display);
  background: var(--hit); color: var(--hit-fg);
  padding: 8px 12px; border-radius: 10px;
  font-variant-numeric: tabular-nums;
}

form { display: flex; gap: 8px; }
.field { flex: 1; min-width: 0; position: relative; }
.field label {
  position: absolute; left: 14px; top: 7px;
  font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
#mesa {
  width: 100%;
  font: 400 30px/1 var(--font-display);
  padding: 24px 14px 8px;
  border: 2px solid var(--table-line);
  border-radius: 12px;
  background: var(--card);
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
#mesa:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
#mesa::placeholder { color: var(--table-line); }
button {
  font: 800 17px/1 var(--font-body);
  padding: 0 20px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-fg);
  cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }
button:active { transform: translateY(1px); }

.result {
  min-height: 64px;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  padding-block: 4px;
}
.result strong { font-size: 18px; }
.result span { color: var(--muted); font-size: 15px; }
.result.error strong { color: var(--accent); }

.map-wrap {
  background: var(--floor);
  border-radius: 16px;
  padding: 8px;
  scroll-margin-top: 12px;
}
svg { display: block; width: 100%; height: auto; }
.wall { fill: none; stroke: var(--wall); stroke-width: 3; }
.stage { fill: var(--stage); }
.stage-txt { fill: var(--stage-fg); font: 400 13px var(--font-display); letter-spacing: .25em; }
.door { fill: var(--accent); }
.door-txt { fill: var(--accent); font: 800 10px var(--font-body); letter-spacing: .18em; }
.aisle-txt { fill: var(--muted); font: 600 8px var(--font-body); letter-spacing: .14em; opacity: .7; }

.t circle { fill: var(--table); stroke: var(--table-line); stroke-width: 1.2; transition: opacity .25s; }
.t text { fill: var(--fg); font: 800 13px var(--font-body); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; pointer-events: none; }
.t { cursor: pointer; }
.has-hit .t:not(.hit) { opacity: .45; }
.t.hit circle { fill: var(--hit); stroke: var(--hit-fg); stroke-width: 2; }
.t.hit text { fill: var(--hit-fg); font-size: 15px; }
.pulse { fill: none; stroke: var(--hit); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }

.route { fill: none; stroke: var(--route); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 7; }
.route-draw { animation: draw 1.1s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
.you { fill: var(--route); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
.legend .l-hit { background: var(--hit); }
.legend .l-route { background: var(--route); width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; }

footer { font-size: 12px; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .pulse, .route-draw { animation: none; }
  .pulse { opacity: .6; }
}
</style>
</head>

  const LUGARES = {
    3: 6, 4: 6, 5: 5, 6: 6, 7: 7, 8: 6, 9: 6, 10: 6, 11: 6, 12: 8, 13: 6, 14: 6, 15: 8, 16: 8, 17: 6, 18: 6, 19: 10, 20: 6,
    21: 7, 22: 6, 23: 7, 24: 6, 25: 6, 26: 6, 27: 10, 28: 6, 29: 6, 30: 6, 31: 8, 32: 4, 33: 6, 34: 6, 35: 8, 36: 8, 37: 6, 38: 9, 39: 7, 40: 6,
    41: 6, 42: 6, 43: 6, 44: 6, 45: 6, 46: 6, 47: 6, 48: 6, 49: 6, 50: 6, 51: 6, 52: 6, 53: 6, 54: 6, 56: 6, 57: 8, 58: 10
  };

  const mesas = {};
  for (let c = 0; c <= 8; c++) {
    const rows = c === 0 ? [0, 1, 5, 6] : [0, 1, 2, 3, 4, 5, 6];
    rows.forEach((r, i) => {
      const n = c === 0 ? [1, 2, 3, 4][i] : 5 + (c - 1) * 7 + r;
      mesas[n] = { n, c, r, x: X[r], y: Y0 + c * DY };
    });
  }

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  // Paredes, palco, corredores e entrada
  el("path", { class: "wall", d: "M8 8 H352 V512 H226 M134 512 H8 Z" });
  el("rect", { class: "stage", x: 118, y: 14, width: 124, height: 46, rx: 4 });
  el("text", { class: "stage-txt", x: 180, y: 42, "text-anchor": "middle" }).textContent = "PALCO";
  [AISLE_L, AISLE_R].forEach(x => {
    const t = el("text", { class: "aisle-txt", x, y: 300, "text-anchor": "middle", transform: `rotate(-90 ${x} 300)` });
    t.textContent = "CORREDOR";
  });
  el("rect", { class: "door", x: 134, y: 509, width: 92, height: 6, rx: 3 });
  el("text", { class: "door-txt", x: 180, y: 498, "text-anchor": "middle" }).textContent = "ENTRADA";

  const routeLayer = el("g", {});
  const tablesLayer = el("g", { id: "mesas" });

  Object.values(mesas).forEach(m => {
    const g = el("g", { class: "t", id: "t" + m.n, tabindex: "-1" }, tablesLayer);
    el("circle", { cx: m.x, cy: m.y, r: R }, g);
    el("text", { x: m.x, y: m.y + 0.5 }, g).textContent = m.n;
    g.addEventListener("click", () => { input.value = m.n; mostrar(m.n); });
  });

  function ordinal(n) { return n + "ª"; }

  function descrever(m) {
    const fileira = 9 - m.c; // contando a partir da entrada
    let bloco, posicao, corredor;
    if (m.r >= 5) {
      bloco = "lado esquerdo"; corredor = "corredor da esquerda";
      posicao = m.r === 6 ? "junto à parede" : "junto ao corredor";
    } else if (m.r <= 1) {
      bloco = "lado direito"; corredor = "corredor da direita";
      posicao = m.r === 0 ? "junto à parede" : "junto ao corredor";
    } else {
      bloco = "bloco central, de frente para o palco"; corredor = m.r === 2 ? "corredor da direita" : "corredor da esquerda";
      posicao = { 4: "na ponta esquerda do bloco", 3: "no meio do bloco", 2: "na ponta direita do bloco" }[m.r];
    }
    return {
      titulo: `Mesa ${m.n}: ${bloco}`,
      texto: `Entre, siga pelo ${corredor} até a ${ordinal(fileira)} fileira contando da entrada. A mesa fica ${posicao}.`
    };
  }

  function rota(m) {
    const ax = m.r >= 5 || m.r === 4 || m.r === 3 ? AISLE_L : AISLE_R;
    const gapY = m.y + DY / 2;
    const pts = [[DOOR_X, DOOR_Y - 4], [DOOR_X, CROSS_Y], [ax, CROSS_Y], [ax, gapY], [m.x, gapY], [m.x, m.y + R + 3]];
    return "M" + pts.map(p => p.join(" ")).join(" L");
  }

  const input = document.getElementById("mesa");
  const res = document.getElementById("resultado");
  const erro = document.getElementById("erro");
  const telaBusca = document.getElementById("tela-busca");
  const telaMapa = document.getElementById("tela-mapa");
  const selo = document.getElementById("selo");
  const lugaresEl = document.getElementById("lugares");

  function irParaBusca() {
    limpar();
    mesaAtual = null;
    telaMapa.hidden = true;
    telaBusca.hidden = false;
    try { history.replaceState(null, "", location.pathname + location.search.replace(/[?&]mesa=\d+/, "")); } catch (e) {}
    window.scrollTo(0, 0);
    input.select();
  }
  document.getElementById("voltar").addEventListener("click", irParaBusca);

  function limpar() {
    routeLayer.innerHTML = "";
    svg.classList.remove("has-hit");
    document.querySelectorAll(".t.hit").forEach(g => g.classList.remove("hit"));
    document.querySelectorAll(".pulse").forEach(p => p.remove());
  }

  function mostrar(n) {
    limpar();
    const m = mesas[n];
    if (!m) {
      erro.textContent = n ? `Não existe a mesa ${n}. As mesas vão de 1 a 60.` : "Digite o número da mesa.";
      erro.hidden = false;
      return;
    }
    erro.hidden = true;
    telaBusca.hidden = true;
    telaMapa.hidden = false;
    window.scrollTo(0, 0);
    selo.textContent = "Mesa " + n;
    const lug = LUGARES[n];
    lugaresEl.hidden = !lug;
    if (lug) lugaresEl.textContent = lug + (lug === 1 ? " lugar" : " lugares");
    mesaAtual = n;
    renderChegadas();
    const d = descrever(m);
    res.querySelector("strong").textContent = d.titulo;
    res.querySelector("span").textContent = d.texto;

    const path = el("path", { class: "route route-draw", d: rota(m) }, routeLayer);
    el("circle", { class: "you", cx: DOOR_X, cy: DOOR_Y - 4, r: 4.5 }, routeLayer);

    svg.classList.add("has-hit");
    const g = document.getElementById("t" + n);
    g.classList.add("hit");
    el("circle", { class: "pulse", cx: m.x, cy: m.y, r: R }, tablesLayer);
    tablesLayer.appendChild(g); // mesa destacada por cima

    try { history.replaceState(null, "", "#mesa" + n); } catch (e) {}
  }

  document.getElementById("busca").addEventListener("submit", e => {
    e.preventDefault();
    const n = parseInt(input.value, 10);
    input.blur();
    mostrar(n);
  });
  input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, "").slice(0, 2); });

  // Link direto: ...#mesa29 ou ?mesa=29 (para QR codes)
  function lerLink() {
    const h = (location.hash.match(/mesa(\d{1,2})/) || [])[1];
    const q = new URLSearchParams(location.search).get("mesa");
    const n = parseInt(h || q, 10);
    if (n) { input.value = n; mostrar(n); }
    else if (!telaMapa.hidden) irParaBusca();
  }
  input.addEventListener("input", () => { erro.hidden = true; });
  // Chegadas: contagem compartilhada por mesa, gravada na planilha Google pelo Apps Script.
  // Cole entre as aspas o endereço do App da Web (termina em /exec).
  const API = "https://script.google.com/macros/s/AKfycbz0JkBh1uGaptrtUMoIto6aoKjwraZIHG6EsKqeRmfSQ04JfpwO_UCKsHGCyw0NxBrN/exec";
  const ativo = /^https:\/\/script\.google\.com\//.test(API);
  const INTERVALO = 8000; // atualiza a contagem a cada 8 segundos
  let mesaAtual = null;
  const chegadas = {}, pendentes = {};
  const cheg = {
    box: document.getElementById("chegadas"),
    num: document.getElementById("cheg-num"),
    de: document.getElementById("cheg-de"),
    status: document.getElementById("cheg-status"),
    assentos: document.getElementById("assentos"),
    btns: document.getElementById("cheg-btns"),
    menos: document.getElementById("cheg-menos"),
    mais: document.getElementById("cheg-mais"),
    erro: document.getElementById("cheg-erro"),
    completa: document.getElementById("cheg-completa")
  };

  function renderChegadas() {
    Object.keys(mesas).forEach(k => {
      const g = document.getElementById("t" + k);
      g.classList.toggle("completa", !!LUGARES[k] && (chegadas[k] || 0) >= LUGARES[k]);
    });
    const lug = LUGARES[mesaAtual];
    if (!ativo || !lug) { cheg.box.hidden = true; return; }
    cheg.box.hidden = false;
    lugaresEl.hidden = true; // a caixa de chegadas já mostra os lugares
    const c = chegadas[mesaAtual] || 0;
    cheg.num.textContent = c;
    cheg.de.textContent = `de ${lug} ${c === 1 ? "chegou" : "chegaram"}`;
    cheg.status.textContent = c < lug ? `Faltam ${lug - c}` : "";
    cheg.status.className = "cheg-status";
    const estavaOculta = cheg.completa.hidden;
    cheg.completa.hidden = c < lug;
    if (c >= lug) {
      const extra = c - lug;
      cheg.completa.className = "cheg-completa" + (extra > 0 ? " alerta" : "");
      cheg.completa.innerHTML = "Mesa completa!<small></small>";
      cheg.completa.querySelector("small").textContent = extra > 0
        ? `${c} pessoas para ${lug} lugares: ${extra} além do reservado.`
        : `Todos os ${lug} convidados já chegaram.`;
      if (estavaOculta) cheg.completa.scrollIntoView({ block: "nearest" });
    }
    cheg.assentos.innerHTML = "";
    for (let i = 0; i < Math.max(lug, c); i++) {
      const d = document.createElement("i");
      if (i < c) d.className = i < lug ? "on" : "extra";
      cheg.assentos.appendChild(d);
    }
    cheg.menos.disabled = c <= 0;
  }

  async function api(params) {
    const r = await fetch(API + "?" + new URLSearchParams(params), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || "erro");
    return j;
  }

  function mostrarErro(texto) {
    cheg.erro.textContent = texto;
    cheg.erro.hidden = !texto;
  }

  async function carregar() {
    if (!ativo) return;
    try {
      const j = await api({ acao: "listar" });
      Object.keys(mesas).forEach(k => { if (!pendentes[k]) chegadas[k] = Number(j.chegadas[k]) || 0; });
      if (j.lugares) {
        // A coluna "Lugares" da planilha manda; os números embutidos só valem até a primeira resposta
        Object.keys(LUGARES).forEach(k => delete LUGARES[k]);
        Object.keys(j.lugares).forEach(k => { const v = Number(j.lugares[k]); if (v > 0) LUGARES[k] = v; });
      }
      mostrarErro("");
    } catch (e) {
      mostrarErro("Sem conexão com a planilha. Os números podem estar desatualizados.");
    }
    renderChegadas();
  }

  async function alterar(delta) {
    const n = mesaAtual;
    if (!ativo || !n) return;
    const antes = chegadas[n] || 0;
    if (antes + delta < 0) return;
    chegadas[n] = antes + delta;
    pendentes[n] = (pendentes[n] || 0) + 1;
    renderChegadas();
    try {
      const j = await api({ acao: "somar", mesa: n, delta: delta });
      pendentes[n]--;
      if (!pendentes[n]) chegadas[n] = Number(j.chegaram) || 0;
      mostrarErro("");
    } catch (e) {
      pendentes[n]--;
      chegadas[n] = Math.max(0, (chegadas[n] || 0) - delta);
      mostrarErro("Não foi possível salvar. Verifique a internet e toque de novo.");
    }
    renderChegadas();
  }
  cheg.mais.addEventListener("click", () => alterar(1));
  cheg.menos.addEventListener("click", () => alterar(-1));

  if (ativo) {
    carregar();
    setInterval(() => { if (!document.hidden) carregar(); }, INTERVALO);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); });
  }

  lerLink();
  window.addEventListener("hashchange", lerLink);
})();
</script>
</body>
</html>
